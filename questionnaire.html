<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABSA AI Expo — Discover Your AI Profile</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .quiz-wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }

    /* Welcome */
    .welcome { text-align: center; padding: 60px 0; }
    .welcome h1 { font-size: clamp(40px, 7vw, 80px); line-height: .95; letter-spacing: -4px; margin-bottom: 20px; }
    .welcome p { font-size: clamp(17px, 2vw, 22px); color: #e8e8e8; max-width: 600px; margin: 0 auto 36px; line-height: 1.5; }
    .start-btn {
      display: inline-block; background: var(--green); color: #000; font-weight: 800;
      font-size: 18px; padding: 16px 48px; border-radius: 50px; border: none;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover { transform: scale(1.04); box-shadow: 0 0 40px rgba(24,201,40,.3); }

    /* Progress */
    .progress-bar { margin-bottom: 36px; }
    .progress-track { height: 4px; background: #222; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.4s ease; }
    .progress-label { font-size: 13px; color: var(--muted); margin-top: 8px; text-align: right; }

    /* Question */
    .question-card { animation: fadeUp 0.35s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .q-number { font-size: 13px; color: var(--green); letter-spacing: 3px; font-weight: 700; margin-bottom: 12px; }
    .q-text { font-size: clamp(22px, 3vw, 30px); font-weight: 700; line-height: 1.3; margin-bottom: 28px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      display: flex; align-items: center; gap: 14px;
      background: rgba(25,25,25,.96); border: 1px solid #333; border-radius: 16px;
      padding: 18px 22px; cursor: pointer; transition: all 0.2s; text-align: left;
      color: #e8e8e8; font-size: 16px; line-height: 1.4;
    }
    .option-btn:hover { border-color: var(--green); background: rgba(24,201,40,.06); }
    .option-btn .opt-icon { font-size: 22px; flex-shrink: 0; }
    .option-btn .opt-label { font-weight: 600; }
    .option-btn .opt-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* Results */
    .results { animation: fadeUp 0.4s ease; }
    .results-header { text-align: center; margin-bottom: 40px; }
    .results-header .profile-icon { font-size: 64px; margin-bottom: 12px; }
    .results-header h2 { font-size: clamp(32px, 5vw, 52px); letter-spacing: -2px; margin-bottom: 8px; }
    .results-header p { font-size: 18px; color: #e8e8e8; max-width: 550px; margin: 0 auto; line-height: 1.5; }

    .result-section { margin-bottom: 36px; }
    .result-section h3 {
      font-size: 14px; letter-spacing: 3px; font-weight: 700;
      color: var(--green); margin-bottom: 16px; text-transform: uppercase;
    }

    .level-display {
      background: rgba(25,25,25,.96); border: 1px solid #303030; border-radius: 20px;
      padding: 28px; display: flex; align-items: center; gap: 20px;
    }
    .level-number {
      width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
      font-size: 28px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .level-details h4 { margin: 0 0 4px; font-size: 20px; }
    .level-details p { margin: 0; color: var(--muted); font-size: 14px; }

    .rec-grid { display: flex; flex-direction: column; gap: 14px; }
    .rec-card {
      background: rgba(25,25,25,.96); border: 1px solid #303030; border-radius: 16px;
      padding: 22px; display: flex; gap: 16px; align-items: flex-start;
      transition: border-color 0.2s;
    }
    .rec-card:hover { border-color: var(--green); }
    .rec-rank {
      width: 36px; height: 36px; border-radius: 10px; background: var(--green);
      color: #000; display: grid; place-items: center; font-weight: 800;
      font-size: 16px; flex-shrink: 0;
    }
    .rec-info h4 { margin: 0 0 4px; font-size: 16px; }
    .rec-info .rec-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .rec-info p { margin: 0; font-size: 13px; color: #b0b5bb; line-height: 1.4; }

    .roadmap-path { display: flex; align-items: center; gap: 0; flex-wrap: wrap; padding: 8px 0; }
    .path-node {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      min-width: 80px; text-align: center;
    }
    .path-dot {
      width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
      font-size: 14px; font-weight: 800; color: #fff; border: 2px solid transparent;
    }
    .path-dot.done { border-color: var(--green); }
    .path-dot.current { box-shadow: 0 0 20px rgba(24,201,40,.4); border-color: var(--green); }
    .path-dot.future { opacity: .4; }
    .path-label { font-size: 11px; color: var(--muted); max-width: 80px; }
    .path-arrow { color: #333; font-size: 18px; margin: 0 2px; align-self: flex-start; margin-top: 10px; }

    .restart-btn {
      display: inline-block; background: transparent; color: var(--green);
      border: 1px solid var(--green); font-size: 15px; font-weight: 700;
      padding: 12px 36px; border-radius: 50px; cursor: pointer; transition: all 0.2s;
      margin-top: 20px;
    }
    .restart-btn:hover { background: var(--green); color: #000; }

    .email-capture {
      background: rgba(25,25,25,.96); border: 1px solid #303030; border-radius: 20px;
      padding: 28px; margin: 8px 0 16px;
    }
    .email-capture h4 { margin: 0 0 6px; font-size: 18px; }
    .email-capture p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .email-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .email-row input[type="email"] {
      flex: 1 1 240px; min-width: 200px; background: rgba(255,255,255,.06);
      border: 1px solid #444; border-radius: 10px; color: #e8e8e8;
      padding: 12px 16px; font-size: 15px; outline: none;
    }
    .email-row input[type="email"]:focus { border-color: var(--green); }
    .email-row .opt-in { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
    .email-row .opt-in input { accent-color: var(--green); }
    .email-btn {
      background: var(--green); color: #000; border: none; font-weight: 800;
      padding: 12px 26px; border-radius: 50px; cursor: pointer; font-size: 15px;
    }
    .email-btn:hover { filter: brightness(1.08); }
    .email-btn:disabled { opacity: .5; cursor: default; }
    .email-status { margin-top: 14px; font-size: 14px; color: var(--green); min-height: 18px; }
    .email-status.error { color: #ef4444; }

    .hidden { display: none !important; }

    @media (max-width: 650px) {
      .level-display { flex-direction: column; text-align: center; }
      .roadmap-path { justify-content: center; }
    }
  </style>
</head>

cost/latency"]},{"id":"sp-data-governance","title":"AI Data Governance & Data Quality","track":"specialist","level":5,"category":"Specialist","targetAudience":"Data stewards, governance analysts","durationHours":32,"description":"Data lineage, classification, quality, access control, training-data governance, and synthetic data for banking compliance.","objectives":["Implement data lineage, ownership, and classification","Ensure data quality and master data management","Manage data access, retention, and residency","Govern training data, synthetic data, and data anonymisation","Secure RAG data governance and knowledge-base governance"]},{"id":"sp-model-risk","title":"AI Model Risk Management","track":"specialist","level":5,"category":"Specialist","targetAudience":"Risk managers, model validators","durationHours":40,"description":"Model validation, documentation, performance monitoring, bias detection, and foundation-model risk in financial services.","objectives":["Perform model validation, documentation, and assumption review","Monitor model performance, drift, and bias","Implement explainability and model approval workflows","Maintain model inventory and retirement processes","Manage third-party and foundation-model risk"]},{"id":"sp-financial-crime","title":"AI for Financial Crime & Fraud","track":"specialist","level":5,"category":"Specialist","targetAudience":"Fraud analysts, compliance officers","durationHours":44,"description":"Fraud detection, anomaly detection, AML, behavioural analytics, network analysis, and explainable fraud models.","objectives":["Implement AI-driven fraud and anomaly detection","Deploy real-time transaction monitoring for AML/KYC","Use behavioural analytics and network analysis for fraud prevention","Reduce false positives with explainable fraud models","Conduct financial crime investigation with AI assistance"]},{"id":"sp-graph-ai","title":"Graph AI","track":"specialist","level":4,"category":"Specialist","targetAudience":"Data scientis language models, multimodal RAG, and banking document intelligence.","objectives":["Build vision-language and audio-language models","Implement image, video, and document understanding","Design multimodal RAG systems","Create multimodal agents with voice + vision","Apply multimodal AI to banking document intelligence"]},{"id":"sp-ai-ux","title":"AI UX & Human-AI Interaction","track":"specialist","level":3,"category":"Specialist","targetAudience":"UX designers, product designers","durationHours":28,"description":"Design AI interfaces, conversational UX, trust in AI, human-in-the-loop systems, and accessibility for non-technical users.","objectives":["Design intuitive AI interfaces for banking customers","Build conversational UX with appropriate AI transparency","Implement human-in-the-loop and error recovery patterns","Design for accessibility and non-technical users","Avoid automation bias in AI-assisted decision making"]},{"id":"sp-workforce","title":"AI Workforce Transformation","track":"specialist","level":6,"category":"Specialist","targetAudience":"HR leaders, department heads","durationHours":28,"description":"AI literacy, job redesign, skills mapping, workforce planning, reskilling, and measuring AI maturity across the organisation.","objectives":["Redesign roles for human-AI collaboration","Map AI skills and plan workforce transformation","Implement AI adoption and employee AI assistant programmes","Measure AI productivity and maturity","Build reskilling and upskilling programmes with AI champions"]},{"id":"sp-finops","title":"AI FinOps & Economics","track":"specialist","level":4,"category":"Specialist","targetAudience":"Technical leads, finance analysts","durationHours":28,"description":"Token economics, GPU/cloud costs, inference economics, model selection, cost optimisation, and AI infrastructure economics.","objectives":["Understand token economics and GPU/cloud AI costs","Calculate cost per inference and cost per customer interaction","Optimise costs through model routing, caching, and quantisation","Evaluate small vs large models and local vs cloud economics","Build AI infrastructure cost models"]},{"id":"sp-ai-safety","title":"AI Safety & Responsible AI","track":"security-governance","level":5,"category":"Security & Governance","targetAudience":"AI engineers, compliance officers","durationHours":32,"description":"AI alignment, guardrails, agent containment, safe tool use, and responsible deployment \u2014 distinct from security and governance.","objectives":["Understand AI alignment and guardrail implementation","Implement human oversight for autonomous systems","Design agent containment and safe tool use","Evaluate dangerous outputs and misuse scenarios","Build responsible deployment and AI incident response processes"]},{"id":"sp-incident-response","title":"AI Incident Response & Resilience","track":"security-governance","level":5,"category":"Security & Governance","targetAudience":"Security teams, SREs","durationHours":28,"description":"What happens when AI fails in production \u2014 incident classification, model rollback, kill switches, root-cause analysis, and post-incident review.","objectives":["Classify and respond to AI incidents in production","Implement model rollback and kill switches","Build human escalation and audit trail processes","Conduct root-cause analysis for AI failures","Perform post-incident review and process improvement"]},{"id":"sp-vendor-risk","title":"AI Supply Chain Risk Management","track":"security-governance","level":5,"category":"Security & Governance","targetAudience":"Procurement, risk managers, IT leads","durationHours":24,"description":"Third-party AI risk, vendor assessment, model provenance, open-source risk, API dependencies, and AI procurement governance.","objectives":["Assess third-party AI and vendor risk","Evaluate model provenance and open-source model licensing","Manage API dependencies and software supply chain risk","Govern data-sharing agreements and prevent vendor lock-in","Build AI procurement frameworks"]}]};

  let currentQ = 0;
  let scores = { leadership: 0, technical: 0, creative: 0, data: 0, security: 0, business: 0, literacy: 0 };
  let levelHints = [];
  let answerLog = [];

  window.startQuiz = function() {
    document.getElementById('screenWelcome').classList.add('hidden');
    document.getElementById('screenQuiz').classList.remove('hidden');
    currentQ = 0;
    scores = { leadership: 0, technical: 0, creative: 0, data: 0, security: 0, business: 0, literacy: 0 };
    levelHints = [];
    answerLog = [];
    renderQuestion();
  };

  function renderQuestion() {
    const q = QUESTIONS[currentQ];
    const pct = ((currentQ) / QUESTIONS.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `Question ${currentQ + 1} of ${QUESTIONS.length}`;

    const container = document.getElementById('questionContainer');
    container.innerHTML = `
      <div class="question-card">
        <div class="q-number">QUESTION ${currentQ + 1}</div>
        <div class="q-text">${q.q}</div>
        <div class="options">
          ${q.options.map((o, i) => `
            <button class="option-btn" onclick="selectAnswer(${i})">
              <span class="opt-icon">${o.icon}</span>
              <span>
                <span class="opt-label">${o.label}</span>
                ${o.desc ? `<div class="opt-desc">${o.desc}</div>` : ''}
              </span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  window.selectAnswer = function(idx) {
    const q = QUESTIONS[currentQ];
    const opt = q.options[idx];
    Object.entries(opt.scores).forEach(([k,v]) => { scores[k] = (scores[k]||0) + v; });
    if (opt.level) levelHints.push(opt.level);
    answerLog.push({ question: q.q, answer: opt.label });

    currentQ++;
    if (currentQ >= QUESTIONS.length) {
      showResults();
    } else {
      renderQuestion();
    }
  };

  function getProfile() {
    const { leadership, technical, creative, data, security, business, literacy } = scores;
    const profileScores = [
      { id: 'strategist', score: leadership * 2 + business },
      { id: 'builder', score: technical * 2 },
      { id: 'investigator', score: data * 2 },
      { id: 'creator', score: creative * 2 + business },
      { id: 'guardian', score: security * 2 + leadership },
      { id: 'data_specialist', score: data * 2 + technical }
    ];
    profileScores.sort((a,b) => b.score - a.score);
    return profileScores[0].id;
  }

  function getLevel() {
    if (levelHints.length > 0) {
      const avg = levelHints.reduce((s,v) => s+v, 0) / levelHints.length;
      return Math.min(7, Math.max(1, Math.round(avg)));
    }
    const { technical, data, security, leadership, literacy } = scores;
    const total = technical + data + security + leadership;
    if (total <= 4) return 1;
    if (total <= 7) return 2;
    if (total <= 10) return 3;
    if (total <= 13) return 4;
    return 5;
  }

  function getRecommendedCourses(profile, level, data) {
    return data.courses
      .filter(c => {
        if (c.level > level + 1) return false;
        if (profile === 'builder' && c.track === 'developer') return true;
        if (profile === 'investigator' && (c.track === 'data-architecture' || c.track === 'foundational')) return true;
        if (profile === 'creator' && (c.track === 'marketing' || c.track === 'prompts-agents')) return true;
        if (profile === 'guardian' && c.track === 'security-governance') return true;
        if (profile === 'data_specialist' && (c.track === 'data-architecture' || c.track === 'specialist')) return true;
        if (profile === 'strategist' && (c.track === 'executive' || c.track === 'specialist')) return true;
        if (c.level <= level) return true;
        return false;
      })
      .sort((a,b) => {
        const aDiff = Math.abs(a.level - level);
        const bDiff = Math.abs(b.level - level);
        return aDiff - bDiff || a.level - b.level;
      })
      .slice(0, 6);
  }

  async function showResults() {
    document.getElementById('screenQuiz').classList.add('hidden');
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressLabel').textContent = 'Complete!';

    const data = COURSE_DATA;
    const profileId = getProfile();
    const level = getLevel();
    const profile = data.profiles.find(p => p.id === profileId) || { name: 'AI Explorer', icon: '\ud83e\udded', description: 'Start your AI journey.' };
    const levelData = data.levels.find(l => l.level === level) || { name: 'Level ' + level, color: '#666', description: '' };

    // Load courses from Airtable (fall back to the bundled catalog if offline).
    let courses = data.courses;
    if (window.AIRTABLE) {
      try {
        const fetched = await AIRTABLE.loadCourses();
        if (fetched && fetched.length) courses = fetched;
      } catch (e) {}
    }

    const dataForRecs = Object.assign({}, data, { courses: courses });
    const recommended = getRecommendedCourses(profileId, level, dataForRecs);

    const container = document.getElementById('screenResults');
    container.classList.remove('hidden');

    const pathHTML = data.levels.map(l => {
      const cls = l.level < level ? 'done' : l.level === level ? 'current' : 'future';
      return `
        <div class="path-node">
          <div class="path-dot ${cls}" style="background:${l.color}">${l.level}</div>
          <div class="path-label">${l.name}</div>
        </div>
        ${l.level < 7 ? '<div class="path-arrow">\u2192</div>' : ''}
      `;
    }).join('');

    container.innerHTML = `
      <div class="results-header">
        <div class="profile-icon">${profile.icon}</div>
        <h2>${profile.name}</h2>
        <p>${profile.description}</p>
      </div>

      <div class="result-section">
        <h3>Your Recommended Level</h3>
        <div class="level-display">
          <div class="level-number" style="background:${levelData.color}">${level}</div>
          <div class="level-details">
            <h4>${levelData.name}</h4>
            <p>${levelData.description}</p>
          </div>
        </div>
      </div>

      <div class="result-section">
        <h3>Your Learning Path</h3>
        <div class="roadmap-path">${pathHTML}</div>
      </div>

      <div class="result-section">
        <h3>Recommended Courses</h3>
        <div class="rec-grid">
          ${recommended.map((c, i) => `
            <div class="rec-card">
              <div class="rec-rank">${i+1}</div>
              <div class="rec-info">
                <h4>${c.title}</h4>
                <div class="rec-meta">${c.durationHours}h &middot; Level ${c.level} &middot; ${c.track.replace(/-/g,' ')}</div>
                <p>${c.description}</p>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="result-section">
        <h3>Get Your Guide</h3>
        <div class="email-capture">
          <h4>Email my recommended course guide to me</h4>
          <p>Enter your email below and we'll send you your personalised AI learning plan. No account needed.</p>
          <div class="email-row">
            <input type="email" id="emailInput" placeholder="you@email.com" autocomplete="email">
            <label class="opt-in"><input type="checkbox" id="optInCheck" checked> Email me my guide</label>
            <button class="email-btn" id="emailSubmit" onclick="submitResults()">Send My Guide</button>
          </div>
          <div class="email-status" id="emailStatus"></div>
        </div>
      </div>

      <div style="text-align:center; padding:20px 0 40px;">
        <button class="restart-btn" onclick="restartQuiz()">Take Quiz Again</button>
        <a href="roadmaps.html" class="restart-btn" style="text-decoration:none;margin-left:12px;">View All Roadmaps</a>
      </div>
    `;

    window.__resultState = {
      profile: profile.name,
      level: level,
      recommendations: recommended.map(c => c.title),
      rawAnswers: JSON.stringify(answerLog)
    };
  }

  window.submitResults = async function() {
    const input = document.getElementById('emailInput');
    const status = document.getElementById('emailStatus');
    const btn = document.getElementById('emailSubmit');
    const email = (input.value || '').trim();
    const optIn = document.getElementById('optInCheck').checked;

    status.className = 'email-status';
    status.textContent = '';
    btn.disabled = true;

    if (!email) {
      status.textContent = 'Please enter your email to receive the guide.';
      status.classList.add('error');
      btn.disabled = false;
      return;
    }

    const state = window.__resultState || { profile: '', level: 0, recommendations: [], rawAnswers: '[]' };

    if (window.AIRTABLE) {
      try {
        await AIRTABLE.submitResult({
          email: email,
          optIn: optIn,
          profile: state.profile,
          level: state.level,
          recommendations: state.recommendations,
          rawAnswers: state.rawAnswers
        });
        status.textContent = 'Thanks! Your guide and results are saved.';
        btn.textContent = 'Sent';
      } catch (e) {
        status.classList.add('error');
        status.textContent = 'Could not save right now. Please try again in a moment.';
      }
    } else {
      status.classList.add('error');
      status.textContent = 'Submission is unavailable. Please try again later.';
    }
    btn.disabled = false;
  };

  window.restartQuiz = function() {
    document.getElementById('screenResults').classList.add('hidden');
    document.getElementById('screenWelcome').classList.remove('hidden');
  };
})();
</script>
